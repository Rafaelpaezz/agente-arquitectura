# Manifiesto del corpus del RAG.
# Cada documento tiene un id corto (se usa en las citas), su referencia completa,
# la licencia y si se puede redistribuir en el repositorio.
#
# - abierto/  : documentos con licencia libre, incluidos en el repo (con su LICENSE).
# - ../docs/adr: registros de decisión de arquitectura (ADR) redactados por el estudiante.
# - externo/  : documentos cuya licencia NO permite redistribuirlos. No se suben al repo
#               (carpeta en .gitignore). Se publica la referencia y el procedimiento de
#               carga local (ver corpus/externo/README.md).

documentos:
  - id: SDP
    titulo: "The System Design Primer"
    alcance: "secciones de temas: rendimiento, disponibilidad, consistencia, bases de datos, caché, asincronía, comunicación, seguridad"
    autor: "Donne Martin y colaboradores"
    tipo: "documentación técnica abierta"
    url: "https://github.com/donnemartin/system-design-primer"
    version: "commit ae9bbd7b02d90b9866215de185217d33f39ab733 (README.md, líneas 412-1576)"
    licencia: "CC BY 4.0 (extracto, sin modificar el texto)"
    redistribuible: true
    ruta: "abierto/system-design-primer"

  - id: 12F
    titulo: "The Twelve-Factor App"
